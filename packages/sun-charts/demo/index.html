<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@signavis/sun-charts demo</title>
  <link rel="stylesheet" href="../src/sun-charts.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    #host { max-width: 420px; }
    #phases { display: grid; grid-template-columns: repeat(4, 220px); gap: 8px; margin-top: 24px; }
    figcaption { font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="phases"></div>
  <h3>Configured</h3>
  <div id="configs" style="display:grid;grid-template-columns:repeat(3,320px);gap:16px;align-items:start"></div>
  <script type="module">
    import { SunCharts, buildDayDial } from '../src/index.ts';
    const charts = new SunCharts({ moon: true });
    document.getElementById('host').append(charts.render({ lat: 51.34, lon: 12.37 }, '2026-06-21', '04:10', 3 * 3600));
    // A month of moon phases at one place, plus one southern-hemisphere dial
    const cases = [
      ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-11-12', '06:00', 1], ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-11-17', '18:00', 1],
      ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-11-24', '22:00', 1], ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-11-28', null, 1],
      ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-12-02', '03:00', 1], ['Leipzig', { lat: 51.34, lon: 12.37 }, '2026-12-06', '05:00', 1],
      ['Sydney', { lat: -33.87, lon: 151.21 }, '2026-11-20', '21:00', 11], ['Sydney', { lat: -33.87, lon: 151.21 }, '2026-12-04', '04:00', 11],
    ];
    const L = { lat: 51.34, lon: 12.37 };
    const configs = document.getElementById('configs');
    // German, dial only, no zone picker, with moon
    configs.append(new SunCharts({ labels: 'de', moon: true, view: 'dial', show: { viewSwitch: false } }).render(L, '2026-11-20', '06:40', 2 * 3600));
    // 12 h clock, own colours, no year chart, no event table
    configs.append(new SunCharts({ clock: '12h', view: 'chart', show: { viewSwitch: false, year: false, events: false },
      colors: { phases: { night: '#222', astronomical: '#3b2a55', nautical: '#5d3f7d', civil: '#9a6fb5', golden: '#f29e4c', day: '#fde6c6' } } })
      .render(L, '2026-06-21', '21:15', 2 * 3600));
    // Dark theme through CSS variables only
    const dark = document.createElement('div');
    dark.style.cssText = 'background:#15171c;color:#e8e8ea;padding:8px;border-radius:8px;--color-text-primary:#f0f0f2;--color-text-secondary:#a8adb8;--color-border:#3a3f4a;--color-bg-surface:#1e2128;--sun-season-summer:#ff8c42;--sun-color-line:#ffd166';
    dark.append(new SunCharts({ storage: { get: () => null, set() {} }, show: { zone: false, title: false } }).render(L, '2026-07-10', null));
    configs.append(dark);
    for (const [name, c, date, time, off] of cases) {
      const fig = document.createElement('figure');
      fig.append(buildDayDial(c, date, time, off, 0, { moon: true }));
      fig.append(Object.assign(document.createElement('figcaption'), { textContent: `${name} ${date} ${time ?? '(no time)'}` }));
      document.getElementById('phases').append(fig);
    }
  </script>
</body>
</html>
