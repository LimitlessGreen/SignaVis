[package]
name = "aw-dsp-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
aw-dsp = { version = "0.1.0", path = "../aw-dsp", default-features = false }
hound = "3.5.1"
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

