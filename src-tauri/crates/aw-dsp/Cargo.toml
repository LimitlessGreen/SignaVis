[package]
name = "aw-dsp"
version = "0.1.0"
edition = "2024"

[dependencies]
half = "2.7.1"
hound = "3.5.1"
rayon = { version = "1.12.0", optional = true }
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["parallel"]
# Multi-threaded frame computation (native). Off for wasm32.
parallel = ["dep:rayon"]

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "bench"
required-features = ["parallel"]
