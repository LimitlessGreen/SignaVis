name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Clone BirdNET-Analyzer labels
        run: |
          git clone --depth 1 --branch v2.4.0 https://github.com/birdnet-team/BirdNET-Analyzer.git _birdnet_upstream

      - name: Get labels hash
        id: labels-hash
        run: |
          echo "hash=$(find _birdnet_upstream/birdnet_analyzer/labels/V2.4 -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Cache Cornell Taxonomy
        uses: actions/cache@v6
        with:
          path: demo/data/cornell-taxonomy.json
          key: cornell-taxonomy-${{ runner.os }}-${{ hashFiles('scripts/build-birdnet-taxonomy.js') }}
          restore-keys: |
            cornell-taxonomy-${{ runner.os }}-

      - name: Cache Species Images
        id: cache-species
        uses: actions/cache@v6
        with:
          path: |
            demo/data/species_images
            demo/data/birdnet-taxonomy.v2.4.json
          key: species-assets-${{ runner.os }}-${{ steps.labels-hash.outputs.hash }}-${{ hashFiles('scripts/build-birdnet-taxonomy.js') }}

      - name: Build taxonomy and download images
        if: steps.cache-species.outputs.cache-hit != 'true'
        run: npm run taxonomy:build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: |
          pip install mkdocs-material

      - name: Build demo site
        run: |
          npx vite build --config demo/vite.demo.config.js
          mkdir -p _site/demo/samples
          cp demo/samples/*.wav _site/demo/samples/
          cp demo/samples/README.md _site/demo/samples/ 2>/dev/null || true

      - name: Build docs into /docs
        run: |
          mkdocs build --config-file mkdocs.yml --site-dir _site/docs

      - name: Root redirect
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>SignaVis – Open-source spectrogram viewer &amp; audio labeling</title>
          <meta name="description" content="SignaVis is a free, open-source web app for bioacoustics: spectrograms, bird and bat call labeling, BirdNET detections and xeno-canto integration.">
          <meta name="google-site-verification" content="LQaceaYKsZF6elDYBWZfJyz8RE2UzSP5u9QXgMI9xNk">
          <link rel="canonical" href="https://limitlessgreen.github.io/SignaVis/">
          <meta property="og:title" content="SignaVis – Open-source spectrogram viewer &amp; audio labeling">
          <meta property="og:image" content="https://raw.githubusercontent.com/LimitlessGreen/SignaVis/main/docs/img/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          </head>
          <body>
          <h1>SignaVis</h1>
          <p>Free, open-source spectrogram viewer and audio labeling tool for bioacoustics.</p>
          <ul>
            <li><a href="demo/labeling-app.html">Open the labeling app</a></li>
            <li><a href="demo/storybook.html">Demo / Storybook</a></li>
            <li><a href="docs/">Documentation</a></li>
            <li><a href="https://github.com/LimitlessGreen/SignaVis">Source code on GitHub</a></li>
          </ul>
          </body>
          </html>
          EOF

      - name: robots.txt and sitemap
        run: |
          printf 'User-agent: *\nAllow: /\nSitemap: https://limitlessgreen.github.io/SignaVis/sitemap.xml\n' > _site/robots.txt
          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://limitlessgreen.github.io/SignaVis/</loc></url>
            <url><loc>https://limitlessgreen.github.io/SignaVis/demo/labeling-app.html</loc></url>
            <url><loc>https://limitlessgreen.github.io/SignaVis/docs/</loc></url>
          </urlset>
          EOF

      - name: Write version.json for deployment
        run: |
          mkdir -p _site
          VERSION="$(node -e "try{const p=require('./package.json'); console.log(p.version||'');}catch(e){console.log('')}")"
          if [ -z "$VERSION" ] && [ -f VERSION ]; then
            VERSION="$(cat VERSION)"
          fi
          COMMIT_SHORT="$(git rev-parse --short HEAD || echo '')"
          COMMIT_FULL="$(git rev-parse HEAD || echo '')"
          COMMIT_DATE="$(git show -s --format=%cI HEAD || date -u +"%Y-%m-%dT%H:%M:%SZ")"
          BUILT_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          printf '{"version":"%s","commit":"%s","commitFull":"%s","commitDate":"%s","builtAt":"%s"}\n' \
            "$VERSION" "$COMMIT_SHORT" "$COMMIT_FULL" "$COMMIT_DATE" "$BUILT_AT" > _site/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
