name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]   # refresh download links on the website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags needed for the build version label

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Clone BirdNET-Analyzer labels
        run: |
          git clone --depth 1 --branch v2.4.0 https://github.com/birdnet-team/BirdNET-Analyzer.git _birdnet_upstream

      - name: Get labels hash
        id: labels-hash
        run: |
          echo "hash=$(find _birdnet_upstream/birdnet_analyzer/labels/V2.4 -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          # Rebuild when the BirdNET taxonomy (names, IDs, image credits) has a new release.
          echo "cornell=$(curl -fsS --retry 3 https://birdnet.cornell.edu/taxonomy/api/stats | jq -r .taxonomy_version || echo unknown)" >> $GITHUB_OUTPUT


      - name: Cache taxonomy
        id: cache-species
        uses: actions/cache@v6
        with:
          path: demo/data/birdnet-taxonomy.json
          key: species-taxonomy-${{ runner.os }}-${{ steps.labels-hash.outputs.hash }}-${{ steps.labels-hash.outputs.cornell }}-${{ hashFiles('scripts/build-birdnet-taxonomy.js') }}

      - name: Build taxonomy
        if: steps.cache-species.outputs.cache-hit != 'true'
        run: npm run taxonomy:build

      # Models are not committed. Downloads (.cache/) and the converted AnuraPAM and
      # 12K folders are cached, so only a changed fetch script downloads again.
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: |
            .cache/models
            .cache/birdbox
            models/birdnet-v3.0-12k
            models/anurapam
          key: models-${{ hashFiles('scripts/fetch-models.mjs', 'scripts/birdbox/**', 'scripts/fetch-birdnet-12k.mjs', 'scripts/fetch-anurapam.sh', 'scripts/anurapam*') }}

      - name: Setup uv (AnuraPAM conversion)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no major tag published)

      - name: Fetch models
        run: npm run models:fetch

      - name: Build demo site
        run: |
          npx vite build --config demo/vite.demo.config.js
          mkdir -p _site/demo/samples
          cp demo/samples/*.wav _site/demo/samples/
          cp demo/samples/README.md _site/demo/samples/ 2>/dev/null || true

      - name: Build website and docs (Astro + Starlight)
        # Landing page at /, docs at /docs (English) and /de/docs (German).
        # Developer docs are imported from docs/ and keep their old URLs.
        # Also writes sitemap-index.xml, sitemap.xml and robots.txt.
        # The token lets the download page read the latest release without rate limits.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix site
          npm run build --prefix site
          cp -r site/dist/. _site/

      - name: Write version.json for deployment
        run: |
          mkdir -p _site
          # Same label as baked into the bundle: "X.Y.Z" on a release tag, else "X.Y.Z+<sha>"
          VERSION="$(node -e "import('./scripts/build-version.mjs').then(m=>console.log(m.getBuildVersion().label))")"
          COMMIT_SHORT="$(git rev-parse --short HEAD || echo '')"
          COMMIT_FULL="$(git rev-parse HEAD || echo '')"
          COMMIT_DATE="$(git show -s --format=%cI HEAD || date -u +"%Y-%m-%dT%H:%M:%SZ")"
          BUILT_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          printf '{"version":"%s","commit":"%s","commitFull":"%s","commitDate":"%s","builtAt":"%s"}\n' \
            "$VERSION" "$COMMIT_SHORT" "$COMMIT_FULL" "$COMMIT_DATE" "$BUILT_AT" > _site/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
