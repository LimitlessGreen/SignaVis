[package]
name = "signavis-lite"
version = "1.4.4"
edition = "2021"
description = "SignaVis Lite – the labeling app as a standalone desktop app"
license = "AGPL-3.0-only"

[lib]
name = "signavis_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Microsoft Store build (MSIX): the Store updates the app, so no self-updater.
store = []
# Local/dev builds only: try CUDA for Perch embeddings first (needs CUDA 12 + cuDNN 9).
cuda = ["aw-embed/cuda"]

[dependencies]
tauri      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir    = "2"
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio      = { version = "1", features = ["fs"] }
half       = "2"
sha2       = "0.10"
aw-catalog = { path = "../src-tauri/crates/aw-catalog" }
symphonia  = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "adpcm"] }

# Perch-2-Embeddings (Plattform-Phase 1); DirectML nur unter Windows.
[target.'cfg(windows)'.dependencies]
aw-embed = { path = "../src-tauri/crates/aw-embed", features = ["directml"] }
[target.'cfg(not(windows))'.dependencies]
aw-embed = { path = "../src-tauri/crates/aw-embed" }
